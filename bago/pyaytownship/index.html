      // remove popup's row if "visible-with-data"
      function removeEmptyRowsFromPopupContent(content, feature) {
        var tempDiv = document.createElement("div");
        tempDiv.innerHTML = content;
        var rows = tempDiv.querySelectorAll("tr");
        for (var i = 0; i < rows.length; i++) {
          var td = rows[i].querySelector("td.visible-with-data");
          var key = td ? td.id : "";
          if (
            td &&
            td.classList.contains("visible-with-data") &&
            feature.properties[key] == null
          ) {
            rows[i].parentNode.removeChild(rows[i]);
          }
        }
        return tempDiv.innerHTML;
      }
      // add class to format popup if it contains media
      function addClassToPopupIfMedia(content, popup) {
        var tempDiv = document.createElement("div");
        tempDiv.innerHTML = content;
        if (tempDiv.querySelector("td img")) {
          popup._contentNode.classList.add("media");
          // Delay to force the redraw
          setTimeout(function () {
            popup.update();
          }, 10);
        } else {
          popup._contentNode.classList.remove("media");
        }
      }

          if (isLayersListExpanded) {
            controlLayersElement.classList.remove(
              "leaflet-control-layers-expanded"
            );
          } else {
            controlLayersElement.classList.add(
              "leaflet-control-layers-expanded"
            );
          }
          isLayersListExpanded = !isLayersListExpanded;
          newLayersListHeight();
        });
        // apply new Layers List height if toggle layerstree
        if (controlLayersElement) {
          controlLayersElement.addEventListener("click", function (event) {
            var toggleLayerHeaderPointer = event.target.closest(
              ".leaflet-layerstree-header-pointer span"
            );
            if (toggleLayerHeaderPointer) {
              newLayersListHeight();
            }
          });
        }
        // Collapsed/Expanded at Start to apply new height
        setTimeout(function () {
          toggleLayerControl.click();
        }, 10);
        setTimeout(function () {
          toggleLayerControl.click();
        }, 10);
        // Collapsed touch/small screen
        var isSmallScreen = window.innerWidth < 650;
        if (isSmallScreen) {
          setTimeout(function () {
            controlLayersElement.classList.remove(
              "leaflet-control-layers-expanded"
            );
            isLayersListExpanded = !isLayersListExpanded;
          }, 500);
        }
      });
      setBounds();
      var i = 0;
      layer_Pyay_TS_Village_1.eachLayer(function (layer) {
        var context = {
          feature: layer.feature,
          variables: {},
        };
        layer.bindTooltip(
          layer.feature.properties["VILLAGE"] !== null
            ? String(
                "<div style=\"color: #000000; font-size: 10pt; font-family: 'Pyidaungsu', sans-serif;\">" +
                  layer.feature.properties["VILLAGE"]
              ) + "</div>"
            : "",
          {
            permanent: true,
            offset: [-0, -16],
            className: "css_Pyay_TS_Village_1",
          }
        );
        labels.push(layer);
        totalMarkers += 1;
        layer.added = true;
        addLabel(layer, i);
        i++;
      });
      map.addControl(
        new L.Control.Search({
          layer: layer_Pyay_TS_Village_1,
          initial: false,
          hideMarkerOnCollapse: true,
          propertyName: "VILLAGE",
        })
      );
      if (typeof url === "undefined") {
        document.getElementsByClassName("search-button")[0].className +=
          " fa fa-binoculars";
      } else {
        document.getElementsByClassName("search-button")[1].className +=
          " fa fa-binoculars";
      }
      resetLabels([layer_Pyay_TS_Village_1]);
      map.on("zoomend", function () {
        resetLabels([layer_Pyay_TS_Village_1]);
      });
      map.on("layeradd", function () {
        resetLabels([layer_Pyay_TS_Village_1]);
      });
      map.on("layerremove", function () {
        resetLabels([layer_Pyay_TS_Village_1]);
      });
    </script>
